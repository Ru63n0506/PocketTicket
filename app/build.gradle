plugins {
    id 'com.android.application'
}

android {
    namespace 'com.app.pocketticket'
    compileSdk 34

    defaultConfig {
        applicationId "com.app.pocketticket"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildFeatures {
        viewBinding false
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.core:core:1.12.0'
}

configurations.all {
    resolutionStrategy.eachDependency { detalles ->
        if (detalles.requested.group == 'org.jetbrains.kotlin'
                && detalles.requested.name.startsWith('kotlin-stdlib')) {
            detalles.useVersion '1.8.22'
        }
    }
}