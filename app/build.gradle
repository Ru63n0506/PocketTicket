// Archivo: app/build.gradle  (módulo :app)
// Sintaxis Groovy tradicional (NO Kotlin DSL).
plugins {
    id 'com.android.application'
}

android {
    namespace 'com.app.pocketticket'
    compileSdk 34

    defaultConfig {
        applicationId "com.app.pocketticket"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildFeatures {
        viewBinding false
    }
}

dependencies {
    // Base para Activities / AppCompat
    implementation 'androidx.appcompat:appcompat:1.6.1'

    // Material Design (botones, AlertDialog, tema Material3)
    implementation 'com.google.android.material:material:1.11.0'

    // RecyclerView para la lista de gastos
    implementation 'androidx.recyclerview:recyclerview:1.3.2'

    // Necesaria para FileProvider (androidx.core.content.FileProvider)
    implementation 'androidx.core:core:1.12.0'
}
